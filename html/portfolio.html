<!DOCTYPE html>
<html lang="ko">
<head>

    <title>홍길동의 포트폴리오</title>

<body>

    <!-- 1. 헤더: 이름과 메뉴 네비게이션 -->

        <h1>안녕하세요, 개발자 홍길동입니다.</h1>
        <nav>
            <ul>
                <li><a href="#about">소개</a></li>
                <li><a href="#skills">기술 스택</a></li>
                <li><a href="#projects">프로젝트</a></li>
                <li><a href="#contact">연락처</a></li>
            </ul>
        </nav>
    </header>

    <!-- 2. 본문: 프로필 소개 -->
    <main>
        <section id="about">
            <h2>About Me</h2>
            <img src="profile.jpg" alt="홍길동 프로필 사진">

            <h2>Skills</h2>
            <ul>
                <li>HTML5 / CSS3</li>
                <li>Visual Studio Code</li>
                <li>Git / GitHub</li>
            </ul>

        <section id="projects">
            <h2>Projects</h2>
            <article>
                <h3>나의 첫 웹사이트 제작</h3>
                <p>HTML만을 이용하여 만든 개인 포트폴리오 사이트입니다.</p>
                <a href="https://github.com" target="_blank">소스코드 보기</a>
            </article>
        </section>
    </main>

    <!-- 5. 푸터: 연락처 및 하단 정보 -->
    <footer id="contact">
        <h2>Contact</h2>
        <p>이메일: email@example.com</p>
        <p>© 2026 홍길동. All rights reserved.</p>
    </footer>
